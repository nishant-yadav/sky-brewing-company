<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not found — redirecting…</title>
  </head>
  <body>
    <p>Redirecting…</p>
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/' && !path.endsWith('/') && path.indexOf('.') === -1) {
          var dest = path + '/' + (location.search || '') + (location.hash || '');
          location.replace(dest);
        }
      })();
    </script>
  </body>
</html>
